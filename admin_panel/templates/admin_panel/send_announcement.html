{% extends "base.html" %}

{% block title %}
Send Announcement | Rongo Homes
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        <i class="fas fa-bullhorn me-2"></i>
                        Send Announcement
                    </h4>

                </div>

                <div class="card-body">

                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endif %}

                    <form
                        method="POST"
                        action="{% url 'admin_panel:send_announcement' %}"
                    >

                        {% csrf_token %}

                        <!-- RECIPIENT -->
                        <div class="mb-4">

                            <label
                                for="recipient_role"
                                class="form-label fw-bold"
                            >
                                Send To
                            </label>

                            <select
                                name="recipient_role"
                                id="recipient_role"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select recipient group
                                </option>

                                <option value="student">
                                    All Students
                                </option>

                                <option value="owner">
                                    All Property Owners
                                </option>

                            </select>

                        </div>

                        <!-- TITLE -->
                        <div class="mb-4">

                            <label
                                for="title"
                                class="form-label fw-bold"
                            >
                                Announcement Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                id="title"
                                class="form-control"
                                placeholder="Enter announcement title"
                                maxlength="200"
                                required
                            >

                        </div>

                        <!-- MESSAGE -->
                        <div class="mb-4">

                            <label
                                for="message"
                                class="form-label fw-bold"
                            >
                                Announcement Message
                            </label>

                            <textarea
                                name="message"
                                id="message"
                                class="form-control"
                                rows="7"
                                placeholder="Write your announcement here..."
                                required
                            ></textarea>

                        </div>

                        <!-- BUTTONS -->
                        <div
                            class="d-flex justify-content-between align-items-center"
                        >

                            <a
                                href="{% url 'admin_panel:dashboard' %}"
                                class="btn btn-outline-secondary"
                            >
                                <i class="fas fa-arrow-left me-2"></i>
                                Back
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                <i class="fas fa-paper-plane me-2"></i>
                                Send Announcement
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
